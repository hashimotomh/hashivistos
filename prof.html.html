        h1 { text-align: center; color: #2c3e50; margin-top: 0; margin-bottom: 12px; font-size: 22px; }
        
        .secao-titulo { font-weight: bold; font-size: 13px; color: #7f8c8d; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; border-bottom: 2px solid #ecf0f1; padding-bottom: 4px; margin-top: 15px; }
        
        /* Selects e Inputs */
        .select-campo, .input-conteudo { width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 8px; font-size: 14px; box-sizing: border-box; background: white; margin-bottom: 8px; }
        .flex-linha { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-secundario { padding: 10px 14px; background-color: #34495e; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; white-space: nowrap; font-size: 13px; }
        
        /* Botões de Exportação */
        .btn-excel { background-color: #27ae60; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; padding: 10px 14px; font-size: 13px; white-space: nowrap; }
        .btn-excel:hover { background-color: #219653; }
        .btn-csv { background-color: #7f8c8d; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; padding: 10px 14px; font-size: 13px; white-space: nowrap; }
        .btn-csv:hover { background-color: #616161; }

        /* Grid de Ocorrências */
        .grid-ocorrencias { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 15px; }
        .btn-acao { padding: 12px 6px; border: 2px solid #bdc3c7; border-radius: 8px; background: #fff; cursor: pointer; font-size: 12px; font-weight: bold; transition: all 0.2s; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 50px; }
        
        .btn-pos.ativo { background-color: #2ecc71 !important; color: white !important; border-color: #27ae60 !important; transform: scale(1.02); }
        .btn-neg.ativo { background-color: #e74c3c !important; color: white !important; border-color: #c0392b !important; transform: scale(1.02); }
        .btn-pos:hover { border-color: #2ecc71; background: #f4fbf7; }
        .btn-neg:hover { border-color: #e74c3c; background: #fdf5f5; }

        /* Grid dos Alunos */
        .grid-alunos { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
        .btn-aluno { padding: 10px; background-color: #ecf0f1; border: 1px solid #bdc3c7; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: 600; text-align: left; transition: all 0.15s; text-transform: uppercase; word-break: break-word; line-height: 1.3; color: #333; }
        .btn-aluno:hover { background-color: #e2e7e9; transform: translateY(-2px); }
        .btn-aluno-teste { background-color: #e2e8f0; border: 1px dashed #64748b; color: #475569; }

        /* Destaque para Alunos que Concluíram a Lição */
        .btn-aluno.licao-concluida { background-color: #2ecc71 !important; color: white !important; border-color: #27ae60 !important; font-weight: bold; }
        .btn-aluno.licao-concluida:hover { background-color: #27ae60 !important; }

        @keyframes piscarSucesso {
            0% { background-color: #2ecc71; color: white; }
            100% { background-color: #ecf0f1; color: #333; }
        }
        .piscar { animation: piscarSucesso 0.5s ease-out; }

        .barra-status { margin-top: 15px; padding: 10px; background: #34495e; color: white; border-radius: 6px; font-size: 13px; text-align: center; font-weight: bold; }

        /* Toast Popup */
        .popup-notificacao { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); background-color: #34495e; color: white; padding: 10px 20px; border-radius: 25px; font-weight: bold; font-size: 13px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 9999; display: none; }

        .popup-erro { background-color: #e74c3c !important; }
        .popup-carregando { background-color: #f39c12 !important; }
    </style>
</head>

    <div id="login-professor-box" style="max-width: 380px; margin: 30px auto; background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #cbd5e1; text-align: center;">

    <!-- PAINEL PRINCIPAL -->
    <div id="painel-professor-conteudo" style="display: none;">
        <h1>Acompanhamento de Aulas 📝</h1>
        
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button id="btn-importar-alunos" onclick="importarAlunosParaBanco()" style="background:#8e44ad; color:white; padding:12px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; flex: 1; font-size:13px;">⚡ Enviar Alunos Mantendo a Ordem Exata</button>
        </div>

        <div class="secao-titulo">1. Selecione a Turma</div>
        <div class="flex-linha">
            <select id="select-turma" class="select-campo" style="flex: 1; min-width: 180px;" onchange="aoMudarTurma()">
                <option value="">-- Escolha a Turma --</option>
                <option value="1F">1F</option>
                <option value="2H">2H</option>
                <option value="2I">2I</option>
                <option value="3D">3D</option>
            </select>
            <button class="btn-excel" onclick="gerarRelatorioPlanilha('xlsx')">📊 Baixar Excel (.xlsx)</button>
            <button class="btn-csv" onclick="gerarRelatorioPlanilha('csv')">📄 Baixar CSV</button>
        </div>

        <div class="secao-titulo">2. Atividade Atual</div>
        <div class="flex-linha">
            <select id="select-atividade" class="select-campo" style="flex: 1;" onchange="marcarAlunosComLicaoFeita()">

            </select>
            <button class="btn-secundario" onclick="cadastrarNovaAtividade()">+ Nova Atividade</button>
        </div>

        <div class="secao-titulo">3. Selecione a Ocorrência</div>
        <div class="grid-ocorrencias">
            <button class="btn-acao btn-pos" onclick="selecionarOcorrencia(this, 'Lição de Sala feita')">

            </button>
            <button class="btn-acao btn-pos" onclick="selecionarOcorrencia(this, 'Plataforma feita')">
                <span>💻 Plataforma feita</span>
            </button>
            <button class="btn-acao btn-neg" onclick="selecionarOcorrencia(this, 'Não trouxe material')">
                <span>✏️ Não trouxe material</span>
            </button>
            <button class="btn-acao btn-neg" onclick="selecionarOcorrencia(this, 'Desrespeito')">
                <span>⚠️ Desrespeito</span>
            </button>
        </div>

        <div class="secao-titulo">4. Clique no Aluno para Registrar</div>
        <div class="grid-alunos" id="grid-alunos-container">

</div>

    function lancarPopUp(texto, tipo) {
        const popup = document.getElementById("popup-alerta");
        if (!popup) return;
        popup.innerText = texto;
        popup.className = "popup-notificacao";
        if(tipo === "sucesso") popup.classList.add("popup-sucesso");
        if(tipo === "erro") popup.classList.add("popup-erro");
        if(tipo === "carregando") popup.classList.add("popup-carregando");
        
        popup.style.display = "block";
        if(tipo !== "carregando") {
            setTimeout(() => { popup.style.display = "none"; }, 1800);
        }
    }

    async function fazerLoginProfessor() {
        const email = document.getElementById("email-prof").value.trim();
        const senha = document.getElementById("senha-prof").value.trim();
        const erroBox = document.getElementById("erro-login-prof");

        if(!email || !senha) {
            erroBox.innerText = "Preencha o e-mail e a senha.";
            erroBox.style.display = "block";
            return;
        }

        try {
            await auth.signInWithEmailAndPassword(email, senha);
            document.getElementById("login-professor-box").style.display = "none";
            document.getElementById("painel-professor-conteudo").style.display = "block";
            lancarPopUp("🔓 Login Efetuado!", "sucesso");
        } catch (e) {
            erroBox.innerText = "Falha no login: " + e.message;
            erroBox.style.display = "block";
        }
    }

    function aoMudarTurma() {
        carregarAlunosTurmaDoBanco();
        carregarAtividadesDaTurma();
    }

    async function carregarAtividadesDaTurma(atividadeParaSelecionar = null) {
        const turma = document.getElementById("select-turma").value;
        const selectAtividade = document.getElementById("select-atividade");
        
        selectAtividade.innerHTML = '<option value="Geral/Aula">Geral / Aula Convencional</option>';

        if(!turma) return;

        try {
            const snapshot = await db.collection("atividades")
                                    .where("turma", "==", turma)
                                    .get();

            let lista = [];
            snapshot.forEach(doc => {
                const item = doc.data();
                lista.push({
                    nome: item.nome,
                    criadoEm: item.criadoEm ? item.criadoEm.toMillis() : 0
                });
            });

            lista.sort((a, b) => b.criadoEm - a.criadoEm);

            lista.forEach(item => {
                const opt = document.createElement("option");
                opt.value = item.nome;
                opt.innerText = item.nome;
                selectAtividade.appendChild(opt);
            });

            if (atividadeParaSelecionar) {
                selectAtividade.value = atividadeParaSelecionar;
            }
            
            marcarAlunosComLicaoFeita();
        } catch(e) {
            console.error("Erro ao carregar atividades:", e);
        }
    }

    async function cadastrarNovaAtividade() {
        const turma = document.getElementById("select-turma").value;

        if (!turma) {
            lancarPopUp("⚠️ Escolha uma turma antes!", "erro");
            alert("Por favor, selecione primeiro a turma para a qual deseja cadastrar a atividade.");
            return;
        }

        const nomeAtividade = prompt(`Digite o nome/título da atividade para a Turma ${turma}:`);
        if (!nomeAtividade || nomeAtividade.trim() === "") return;

        const nomeTratado = nomeAtividade.trim();

        try {
            lancarPopUp("Salvando atividade...", "carregando");
            
            await db.collection("atividades").add({
                nome: nomeTratado,
                turma: turma,
                criadoEm: firebase.firestore.FieldValue.serverTimestamp()
            });

            lancarPopUp("✅ Atividade Cadastrada!", "sucesso");
            carregarAtividadesDaTurma(nomeTratado);
        } catch(e) {
            console.error(e);
            lancarPopUp("Erro ao salvar atividade: " + e.message, "erro");
        }
    }

    async function carregarAlunosTurmaDoBanco() {
        const turma = document.getElementById("select-turma").value;
        const container = document.getElementById("grid-alunos-container");
        container.innerHTML = "";

        if (!turma) {
            container.innerHTML = '<p style="color:#7f8c8d; font-size: 13px;">Selecione uma turma acima.</p>';
            return;
        }

        lancarPopUp("Buscando alunos...", "carregando");

        try {
            let snapshot;
            try {
                snapshot = await db.collection(COLECAO_ALUNOS)
                                    .where("turma", "==", turma)
                                    .orderBy("ordem_matricula", "asc")
                                    .get();
            } catch (errIndex) {
                snapshot = await db.collection(COLECAO_ALUNOS)
                                    .where("turma", "==", turma)
                                    .get();
            }

            if (snapshot.empty) {
                container.innerHTML = `<p style="color:#e74c3c;">Nenhum aluno encontrado na coleção <b>${COLECAO_ALUNOS}</b> para a turma <b>${turma}</b>.</p>`;
                lancarPopUp("Sem alunos encontrados", "erro");
                return;
            }

            let htmlBtns = `<button class="btn-aluno btn-aluno-teste" data-id="9999" data-nome="ALUNO TESTE" onclick="registrarOcorrencia(this, '9999', 'ALUNO TESTE')"><span class="nome-txt">⚙️ TESTE</span></button>`;

            let alunosEncontrados = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                alunosEncontrados.push({
                    id: doc.id,
                    nome: data.nome || "Sem Nome",
                    email: data.email_aluno || "",
                    ordem: data.ordem_matricula !== undefined ? data.ordem_matricula : 999
                });
            });

            alunosEncontrados.sort((a, b) => a.ordem - b.ordem);

            alunosEncontrados.forEach(aluno => {
                const identificador = aluno.email || aluno.nome;
                htmlBtns += `<button class="btn-aluno" data-id="${identificador}" data-nome="${aluno.nome}" onclick="registrarOcorrencia(this, '${identificador}', '${aluno.nome}')"><span class="nome-txt">${aluno.nome}</span></button>`;
            });

            container.innerHTML = htmlBtns;
            lancarPopUp(`Carregados ${alunosEncontrados.length} alunos!`, "sucesso");

            marcarAlunosComLicaoFeita();

        } catch (e) {
            console.error(e);
            container.innerHTML = `<p style="color:#e74c3c;">Erro ao buscar alunos: ${e.message}</p>`;
            lancarPopUp("Erro no carregamento", "erro");
        }
    }

    async function marcarAlunosComLicaoFeita() {
        const turma = document.getElementById("select-turma").value;
        const atividade = document.getElementById("select-atividade").value;

        document.querySelectorAll(".btn-aluno").forEach(btn => {
            btn.classList.remove("licao-concluida");
            const span = btn.querySelector('.nome-txt');
            const nomeOriginal = btn.getAttribute('data-nome');
            if (span && nomeOriginal) {
                span.innerText = nomeOriginal;
            }
        });

        if (!turma || !atividade) return;

        try {
            // Busca apenas em ocorrencias_aulas
            const snapshot = await db.collection(COLECAO_OCORRENCIAS)
                                    .where("turma", "==", turma)
                                    .where("atividade", "==", atividade)
                                    .where("ocorrencia", "==", "Lição de Sala feita")
                                    .get();

            const IDsConcluidos = new Set();
            snapshot.forEach(doc => {
                const data = doc.data();
                if (data.aluno_id) IDsConcluidos.add(data.aluno_id);
                if (data.aluno_nome) IDsConcluidos.add(data.aluno_nome);
            });

            document.querySelectorAll(".btn-aluno").forEach(btn => {
                const alunoId = btn.getAttribute("data-id");
                const alunoNome = btn.getAttribute("data-nome");

                if (IDsConcluidos.has(alunoId) || IDsConcluidos.has(alunoNome)) {
                    btn.classList.add("licao-concluida");
                    const span = btn.querySelector('.nome-txt');
                    if (span) {
                        span.innerText = "✔️ " + alunoNome;
                    }
                }
            });
        } catch (e) {
            console.error("Erro ao verificar lições concluídas:", e);
        }
    }

    async function importarAlunosParaBanco() {
        if(!confirm(`Deseja regravar os ${LISTA_ALUNOS_PILOTO.length} alunos na coleção '${COLECAO_ALUNOS}' garantindo a ordem estrita de matrícula?`)) return;

        const btn = document.getElementById("btn-importar-alunos");
        btn.disabled = true;
        btn.style.opacity = "0.5";
        lancarPopUp("Gravando ordem de matrícula...", "carregando");

        let cadastrados = 0;
        try {
            const contadoresTurma = {};

            for (const aluno of LISTA_ALUNOS_PILOTO) {
                if(contadoresTurma[aluno.turma] === undefined) {
                    contadoresTurma[aluno.turma] = 0;
                }

                await db.collection(COLECAO_ALUNOS).add({
                    nome: aluno.nome,
                    turma: aluno.turma,
                    email_aluno: aluno.email || "",
                    num_chamada: aluno.chamacode || null,
                    email_pais: "",
                    ordem_matricula: contadoresTurma[aluno.turma]
                });

                contadoresTurma[aluno.turma]++;
                cadastrados++;
                document.getElementById("status").innerText = `Salvando Ordem: ${cadastrados}/${LISTA_ALUNOS_PILOTO.length} (${aluno.nome})`;
            }

            lancarPopUp(`✅ ${cadastrados} Alunos salvos na ordem!`, "sucesso");
            document.getElementById("status").innerText = `✅ Sucesso! Alunos cadastrados em ordem estrita de chamada.`;
            btn.style.display = "none";
            
            if(document.getElementById("select-turma").value) {
                aoMudarTurma();
            }
        } catch(e) {
            lancarPopUp("Erro ao salvar: " + e.message, "erro");
            btn.disabled = false;
            btn.style.opacity = "1";
        }
    }

    function selecionarOcorrencia(botao, ocorrencia) {
        document.querySelectorAll('.btn-acao').forEach(b => b.classList.remove('ativo'));
        botao.classList.add('ativo');
        ocorrenciaAtiva = ocorrencia;
        
        document.getElementById("status").innerText = `PRONTO: Clique no aluno para registrar [ ${ocorrencia} ]`;
        lancarPopUp(`Ação selecionada: ${ocorrencia}`, "sucesso");
    }

    async function registrarOcorrencia(botaoAluno, alunoId, nomeAluno) {
        const turma = document.getElementById("select-turma").value;
        const atividade = document.getElementById("select-atividade").value;

        if (!turma) {
            lancarPopUp("⚠️ Escolha a Turma!", "erro");
            return;
        }
        if (!ocorrenciaAtiva) {
            lancarPopUp("⚠️ Escolha a Ocorrência primeiro!", "erro");
            return;
        }

        lancarPopUp(`Gravando para ${nomeAluno}...`, "carregando");

        try {
            // Gravação feita diretamente em ocorrencias_aulas
            await db.collection(COLECAO_OCORRENCIAS).add({
                aluno_id: alunoId,
                aluno_nome: nomeAluno,
                turma: turma,
                ocorrencia: ocorrenciaAtiva,
                atividade: atividade,
                data: firebase.firestore.FieldValue.serverTimestamp(),
                data_string: new Date().toISOString().split('T')[0]
            });

            if (ocorrenciaAtiva === "Lição de Sala feita") {
                botaoAluno.classList.add("licao-concluida");
                const span = botaoAluno.querySelector('.nome-txt');
                if (span) {
                    span.innerText = "✔️ " + nomeAluno;
                }
            } else {
                botaoAluno.classList.add('piscar');
                setTimeout(() => botaoAluno.classList.remove('piscar'), 500);
            }

            lancarPopUp(`✅ ${nomeAluno}: ${ocorrenciaAtiva}!`, "sucesso");
            document.getElementById("status").innerText = `✅ Gravado: [${ocorrenciaAtiva}] -> ${nomeAluno}`;

        } catch (error) {
            document.getElementById("status").innerText = `❌ Erro: ${error.message}`;
            lancarPopUp("❌ Falha ao gravar!", "erro");
        }
    }

    // =======================================================
    // GERAR RELATÓRIO EXCEL/CSV (Consultando apenas ocorrencias_aulas)
    // =======================================================
    async function gerarRelatorioPlanilha(formato) {
        const turma = document.getElementById("select-turma").value;
        if (!turma) {
            lancarPopUp("⚠️ Escolha uma turma primeiro!", "erro");
            return;
        }

        lancarPopUp("Gerando Planilha...", "carregando");

        try {
            // 1. Buscar Alunos
            let snapAlunos = await db.collection(COLECAO_ALUNOS)
                                     .where("turma", "==", turma)
                                     .get();

            let listaAlunos = [];
            snapAlunos.forEach(doc => {
                const data = doc.data();
                listaAlunos.push({
                    id: doc.id,
                    nome: data.nome || "Sem Nome",
                    email: data.email_aluno || "",
                    ordem: data.ordem_matricula !== undefined ? data.ordem_matricula : 999
                });
            });
            listaAlunos.sort((a, b) => a.ordem - b.ordem);

            if (listaAlunos.length === 0) {
                lancarPopUp("Nenhum aluno encontrado!", "erro");
                return;
            }

            // 2. Buscar Atividades da Turma
            let snapAtiv = await db.collection("atividades")
                                   .where("turma", "==", turma)
                                   .get();

            let listaAtividades = ["Geral/Aula"];
            let ativDocs = [];
            snapAtiv.forEach(doc => {
                const d = doc.data();
                ativDocs.push({ nome: d.nome, criadoEm: d.criadoEm ? d.criadoEm.toMillis() : 0 });
            });
            ativDocs.sort((a, b) => a.criadoEm - b.criadoEm);
            ativDocs.forEach(a => {
                if(a.nome !== "Geral/Aula") listaAtividades.push(a.nome);
            });

            // 3. Buscar Ocorrências exclusivamente da coleção ocorrencias_aulas
            let snapHist = await db.collection(COLECAO_OCORRENCIAS)
                                   .where("turma", "==", turma)
                                   .get();

            let dadosAlunos = {};
            listaAlunos.forEach(a => {
                const key = a.email || a.nome;
                dadosAlunos[key] = {
                    nome: a.nome,
                    licoes: {},
                    plataforma: 0,
                    semMaterial: 0,
                    desrespeito: 0
                };
            });

            snapHist.forEach(doc => {
                const h = doc.data();
                const key = h.aluno_id || h.aluno_nome;

                if (dadosAlunos[key]) {
                    if (h.ocorrencia === "Lição de Sala feita") {
                        const ativNome = h.atividade || "Geral/Aula";
                        dadosAlunos[key].licoes[ativNome] = true;
                    } else if (h.ocorrencia === "Plataforma feita") {
                        dadosAlunos[key].plataforma += 1;
                    } else if (h.ocorrencia === "Não trouxe material") {
                        dadosAlunos[key].semMaterial += 1;
                    } else if (h.ocorrencia === "Desrespeito") {
                        dadosAlunos[key].desrespeito += 1;
                    }
                }
            });

            // 4. Montar Matriz para Exportação
            let dadosPlanilha = [];

            listaAlunos.forEach(aluno => {
                const key = aluno.email || aluno.nome;
                const info = dadosAlunos[key];

                let linha = {
                    "Aluno": info.nome
                };

                listaAtividades.forEach(ativ => {
                    linha[ativ] = info.licoes[ativ] ? "SIM" : "NÃO";
                });

                linha["Plataformas Feitas"] = info.plataforma;
                linha["Não Trouxe Material"] = info.semMaterial;
                linha["Desrespeito"] = info.desrespeito;

                dadosPlanilha.push(linha);
            });

            // 5. Download com SheetJS
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(dadosPlanilha);

            const colWidths = [{ wch: 35 }];
            listaAtividades.forEach(() => colWidths.push({ wch: 18 }));
            colWidths.push({ wch: 18 }, { wch: 18 }, { wch: 15 });
            ws['!cols'] = colWidths;

            XLSX.utils.book_append_sheet(wb, ws, `Turma ${turma}`);

            const nomeArquivo = `Relatorio_Desempenho_${turma}_${new Date().toISOString().split('T')[0]}`;

            if (formato === 'csv') {
                XLSX.writeFile(wb, `${nomeArquivo}.csv`, { bookType: 'csv' });
            } else {
                XLSX.writeFile(wb, `${nomeArquivo}.xlsx`);
            }

            lancarPopUp("✅ Planilha Baixada!", "sucesso");

        } catch (e) {
            console.error("Erro ao gerar planilha:", e);
            lancarPopUp("Erro ao exportar: " + e.message, "erro");
        }
    }
</script>
