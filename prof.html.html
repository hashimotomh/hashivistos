    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .login-box { max-width: 350px; margin: 50px auto; padding: 25px; border: 1px solid #ddd; border-radius: 10px; background: #fff; text-align: center; }
        .login-box input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; }
        
        .popup-notificacao { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; color: #fff; font-weight: bold; z-index: 9999; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .popup-sucesso { background-color: #2ecc71; }
        .popup-erro { background-color: #e74c3c; }
        .popup-carregando { background-color: #3498db; }

        .secao { margin-bottom: 20px; }
        label { font-weight: bold; margin-right: 10px; }
        select, button { padding: 10px 15px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; cursor: pointer; }
        
        .btn-acao { background-color: #ecf0f1; border: 1px solid #bdc3c7; transition: all 0.2s; margin-right: 5px; margin-bottom: 5px; }
        .btn-acao.ativo { background-color: #3498db; color: #fff; border-color: #2980b9; font-weight: bold; }
        
        .grid-alunos { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 15px; }
        .btn-aluno { background-color: #ffffff; border: 2px solid #34495e; color: #2c3e50; padding: 12px; border-radius: 8px; text-align: left; font-weight: 600; display: flex; align-items: center; justify-content: space-between; transition: all 0.2s; }
        .btn-aluno-teste { border-dash: 2px dashed #7f8c8d; background-color: #f8f9fa; }
        
        .btn-aluno.licao-concluida { background-color: #d4edda; border-color: #28a745; color: #155724; }
        .btn-aluno.licao-atrasada { background-color: #fff3cd; border-color: #ffc107; color: #856404; }
        
        .badge-atraso { background-color: #dc3545; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 5px; }
        .status-bar { background: #eef2f7; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-weight: 500; }
        .piscar { animation: flash 0.5s; }
        @keyframes flash { 0% { background-color: #f1c40f; } 100% { background-color: #ffffff; } }
    </style>
</head>

    <div id="popup-alerta" class="popup-notificacao"></div>

    <div id="login-professor-box" class="login-box">
        <h2>Área do Professor</h2>
        <input type="email" id="email-prof" placeholder="E-mail do Professor">
        <input type="password" id="senha-prof" placeholder="Senha">
        <button onclick="fazerLoginProfessor()" style="background:#2ecc71; color:white; border:none; width:100%; margin-top:10px;">Entrar</button>
        <p id="erro-login-prof" style="color:red; display:none; margin-top:10px; font-size:12px;"></p>
    </div>

    <div id="painel-professor-conteudo" class="container" style="display: none;">
        <h2>Painel do Professor</h2>
        
        <div class="status-bar" id="status">Selecione uma turma para iniciar.</div>

        <div class="secao">
            <label for="select-turma">Turma:</label>
            <select id="select-turma" onchange="aoMudarTurma()">
                <option value="">-- Selecione --</option>
                <option value="1F">1F</option>
                <option value="2H">2H</option>
                <option value="2I">2I</option>
                <option value="3D">3D</option>
            </select>

            <label for="select-atividade" style="margin-left: 15px;">Atividade:</label>
            <select id="select-atividade" onchange="marcarAlunosComLicaoFeita()">
                <option value="Geral/Aula" data-prazo="">Geral / Aula Convencional</option>
            </select>

            <button onclick="cadastrarNovaAtividade()" style="background:#8e44ad; color:white; border:none;">+ Nova Atividade</button>
        </div>

        <div class="secao">
            <label>Registrar:</label><br><br>
            <button class="btn-acao" onclick="selecionarOcorrencia(this, 'Lição de Sala feita')">✔️ Lição Feita</button>
            <button class="btn-acao" onclick="selecionarOcorrencia(this, 'Tirou Dúvidas')">💡 Tirou Dúvida</button>
            <button class="btn-acao" onclick="selecionarOcorrencia(this, 'Plataforma feita')">💻 Plataforma</button>
            <button class="btn-acao" onclick="selecionarOcorrencia(this, 'Não trouxe material')">📚 Sem Material</button>
            <button class="btn-acao" onclick="selecionarOcorrencia(this, 'Desrespeito')">⚠️ Desrespeito</button>
        </div>

        <hr>

        <div id="grid-alunos-container" class="grid-alunos">
            <p style="color:#7f8c8d; font-size: 13px;">Selecione uma turma acima.</p>
        </div>

        <hr style="margin-top: 30px;">

        <div class="secao" style="margin-top: 20px;">
            <h3>Ferramentas do Sistema</h3>
            <button id="btn-importar-alunos" onclick="importarAlunosParaBanco()" style="background:#e67e22; color:white; border:none;">🔄 Sincronizar / Limpar Alunos</button>
            <button onclick="gerarRelatorioPlanilha('xlsx')" style="background:#27ae60; color:white; border:none; margin-left: 10px;">📊 Baixar Relatório (Excel)</button>
        </div>
    </div>

        function lancarPopUp(texto, tipo) {
            const popup = document.getElementById("popup-alerta");
            if (!popup) return;
            popup.innerText = texto;
            popup.className = "popup-notificacao";
            if(tipo === "sucesso") popup.classList.add("popup-sucesso");
            if(tipo === "erro") popup.classList.add("popup-erro");
            if(tipo === "carregando") popup.classList.add("popup-carregando");
            
            popup.style.display = "block";
            if(tipo !== "carregando") {
                setTimeout(() => { popup.style.display = "none"; }, 1800);
            }
        }

        function obterDataHojeLocal() {
            const d = new Date();
            const ano = d.getFullYear();
            const mes = String(d.getMonth() + 1).padStart(2, '0');
            const dia = String(d.getDate()).padStart(2, '0');
            return `${ano}-${mes}-${dia}`;
        }

        async function carregarAtividadesDaTurma(atividadeParaSelecionar = null) {
            const turma = document.getElementById("select-turma").value;
            const selectAtividade = document.getElementById("select-atividade");
            
            selectAtividade.innerHTML = '<option value="Geral/Aula" data-prazo="">Geral / Aula Convencional</option>';

            if(!turma) return;

            try {
                const snapshot = await db.collection("atividades")
                                        .where("turma", "==", turma)
                                        .get();

                let lista = [];
                snapshot.forEach(doc => {
                    const item = doc.data();
                    lista.push({
                        nome: item.nome,
                        dataLimite: item.dataLimite || "",
                        criadoEm: item.criadoEm ? item.criadoEm.toMillis() : 0
                    });
                });

                lista.sort((a, b) => b.criadoEm - a.criadoEm);

                lista.forEach(item => {
                    const opt = document.createElement("option");
                    opt.value = item.nome;
                    opt.setAttribute("data-prazo", item.dataLimite);
                    opt.innerText = item.dataLimite ? `${item.nome} (Prazo: ${item.dataLimite})` : item.nome;
                    selectAtividade.appendChild(opt);
                });

                if (atividadeParaSelecionar) {
                    selectAtividade.value = atividadeParaSelecionar;
                }
                
                marcarAlunosComLicaoFeita();
            } catch(e) {
                console.error("Erro ao carregar atividades:", e);
            }
        }

        async function cadastrarNovaAtividade() {
            const turma = document.getElementById("select-turma").value;

            if (!turma) {
                lancarPopUp("⚠️ Escolha uma turma antes!", "erro");
                alert("Por favor, selecione primeiro a turma para a qual deseja cadastrar a atividade.");
                return;
            }

            const nomeAtividade = prompt(`Digite o nome/título da atividade para a Turma ${turma}:`);
            if (!nomeAtividade || nomeAtividade.trim() === "") return;

            const dataLimite = prompt("Digite a Data Limite de entrega (Formato: AAAA-MM-DD):", obterDataHojeLocal());
            if (!dataLimite) return;

            const nomeTratado = nomeAtividade.trim();

            try {
                lancarPopUp("Salvando atividade...", "carregando");
                
                await db.collection("atividades").add({
                    nome: nomeTratado,
                    turma: turma,
                    dataLimite: dataLimite,
                    criadoEm: firebase.firestore.FieldValue.serverTimestamp()
                });

                lancarPopUp("✅ Atividade Cadastrada!", "sucesso");
                carregarAtividadesDaTurma(nomeTratado);
            } catch(e) {
                console.error(e);
                lancarPopUp("Erro ao salvar atividade: " + e.message, "erro");
            }
        }

        async function carregarAlunosTurmaDoBanco() {
            const turma = document.getElementById("select-turma").value;
            const container = document.getElementById("grid-alunos-container");
            container.innerHTML = "";

            if (!turma) {
                container.innerHTML = '<p style="color:#7f8c8d; font-size: 13px;">Selecione uma turma acima.</p>';
                return;
            }

            lancarPopUp("Buscando alunos...", "carregando");

            try {
                const snapshot = await db.collection(COLECAO_ALUNOS)
                                        .where("turma", "==", turma)
                                        .get();

                if (snapshot.empty) {
                    container.innerHTML = `<p style="color:#e74c3c;">Nenhum aluno encontrado na coleção <b>${COLECAO_ALUNOS}</b> para a turma <b>${turma}</b>.</p>`;
                    lancarPopUp("Sem alunos encontrados", "erro");
                    return;
                }

                let htmlBtns = `<button class="btn-aluno btn-aluno-teste" data-id="9999" data-nome="ALUNO TESTE" onclick="registrarOcorrencia(this, '9999', 'ALUNO TESTE')"><span class="nome-txt">⚙️ TESTE</span></button>`;

                let alunosEncontrados = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    alunosEncontrados.push({
                        id: doc.id,
                        nome: data.nome || "Sem Nome",
                        email: data.email_aluno || "",
                        ordem: data.ordem_matricula !== undefined ? data.ordem_matricula : 999
                    });
                });

                alunosEncontrados.sort((a, b) => a.ordem - b.ordem);

                alunosEncontrados.forEach(aluno => {
                    const identificador = aluno.email || aluno.nome;
                    htmlBtns += `<button class="btn-aluno" data-id="${identificador}" data-nome="${aluno.nome}" onclick="registrarOcorrencia(this, '${identificador}', '${aluno.nome}')"><span class="nome-txt">${aluno.nome}</span></button>`;
                });

                container.innerHTML = htmlBtns;
                lancarPopUp(`Carregados ${alunosEncontrados.length} alunos!`, "sucesso");

                marcarAlunosComLicaoFeita();

            } catch (e) {
                console.error(e);
                container.innerHTML = `<p style="color:#e74c3c;">Erro ao buscar alunos: ${e.message}</p>`;
                lancarPopUp("Erro no carregamento", "erro");
            }
        }

        async function marcarAlunosComLicaoFeita() {
            const turma = document.getElementById("select-turma").value;
            const atividade = document.getElementById("select-atividade").value;

            document.querySelectorAll(".btn-aluno").forEach(btn => {
                btn.classList.remove("licao-concluida", "licao-atrasada");
                const span = btn.querySelector('.nome-txt');
                const nomeOriginal = btn.getAttribute('data-nome');
                if (span && nomeOriginal) {
                    span.innerText = nomeOriginal;
                }
            });

            if (!turma || !atividade) return;

            try {
                const snapshot = await db.collection(COLECAO_OCORRENCIAS)
                                        .where("turma", "==", turma)
                                        .where("atividade", "==", atividade)
                                        .get();

                const statusAlunos = {};

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const key = data.aluno_id || data.aluno_nome;
                    
                    if (!statusAlunos[key]) {
                        statusAlunos[key] = { fezLicao: false, tirouDuvida: false, emAtraso: false };
                    }

                    if (data.ocorrencia === "Lição de Sala feita") {
                        statusAlunos[key].fezLicao = true;
                        if (data.emAtraso) statusAlunos[key].emAtraso = true;
                    } else if (data.ocorrencia === "Tirou Dúvidas") {
                        statusAlunos[key].tirouDuvida = true;
                    }
                });

                document.querySelectorAll(".btn-aluno").forEach(btn => {
                    const alunoId = btn.getAttribute("data-id");
                    const alunoNome = btn.getAttribute("data-nome");

                    const reg = statusAlunos[alunoId] || statusAlunos[alunoNome];

                    if (reg) {
                        const span = btn.querySelector('.nome-txt');
                        let textoHTML = "";

                        if (reg.tirouDuvida) {
                            textoHTML += "💡 ";
                        }

                        if (reg.fezLicao) {
                            if (reg.emAtraso) {
                                btn.classList.add("licao-atrasada");
                                textoHTML += "✔️ " + alunoNome + `<span class="badge-atraso">ATRASO</span>`;
                            } else {
                                btn.classList.add("licao-concluida");
                                textoHTML += "✔️ " + alunoNome;
                            }
                        } else {
                            textoHTML += alunoNome;
                        }

                        if (span) {
                            span.innerHTML = textoHTML;
                        }
                    }
                });
            } catch (e) {
                console.error("Erro ao verificar lições concluídas:", e);
            }
        }

        async function importarAlunosParaBanco() {
            if(!confirm(`Deseja sincronizar a lista de alunos para a coleção '${COLECAO_ALUNOS}'?\n\n- Alunos novos serão adicionados;\n- Duplicados e ausentes serão REMOVIDOS;\n- Dados existentes serão atualizados.`)) return;

            const btn = document.getElementById("btn-importar-alunos");
            if(btn) {
                btn.disabled = true;
                btn.style.opacity = "0.5";
            }
            lancarPopUp("Sincronizando e limpando banco...", "carregando");

            try {
                const turmasAfetadas = [...new Set(LISTA_ALUNOS_PILOTO.map(a => a.turma))];
                const contadoresTurma = {};
                const mapaNovosAlunos = new Map();

                LISTA_ALUNOS_PILOTO.forEach(aluno => {
                    if (contadoresTurma[aluno.turma] === undefined) {
                        contadoresTurma[aluno.turma] = 0;
                    }
                    
                    const chaveTexto = (aluno.email || aluno.nome).trim().toUpperCase();
                    const idDocumentoFixo = chaveTexto.replace(/[^a-zA-Z0-9]/g, "_");
                    
                    mapaNovosAlunos.set(idDocumentoFixo, {
                        nome: aluno.nome,
                        turma: aluno.turma,
                        email_aluno: aluno.email || "",
                        num_chamada: aluno.chamacode || null,
                        email_pais: "",
                        ordem_matricula: contadoresTurma[aluno.turma]
                    });

                    contadoresTurma[aluno.turma]++;
                });

                for (const turma of turmasAfetadas) {
                    const snapSnapshot = await db.collection(COLECAO_ALUNOS)
                                             .where("turma", "==", turma)
                                             .get();

                    let batch = db.batch();
                    let operacoes = 0;
                    const idsJaProcessadosNaTurma = new Set();

                    for (const doc of snapSnapshot.docs) {
                        const docId = doc.id;
                        const data = doc.data();
                        
                        const chaveTextoBanco = (data.email_aluno || data.nome || "").trim().toUpperCase();
                        const idFixoEsperado = chaveTextoBanco.replace(/[^a-zA-Z0-9]/g, "_");

                        if (idsJaProcessadosNaTurma.has(idFixoEsperado) || !mapaNovosAlunos.has(idFixoEsperado) || docId !== idFixoEsperado) {
                            batch.delete(doc.ref);
                            operacoes++;
                        } else {
                            batch.set(doc.ref, mapaNovosAlunos.get(idFixoEsperado), { merge: true });
                            idsJaProcessadosNaTurma.add(idFixoEsperado);
                            mapaNovosAlunos.delete(idFixoEsperado);
                            operacoes++;
                        }

                        if (operacoes >= 400) {
                            await batch.commit();
                            batch = db.batch();
                            operacoes = 0;
                        }
                    }

                    if (operacoes > 0) {
                        await batch.commit();
                    }
                }

                if (mapaNovosAlunos.size > 0) {
                    let batchAdicao = db.batch();
                    let countAdicao = 0;

                    for (const [idFixo, dadosNovo] of mapaNovosAlunos.entries()) {
                        const novoDocRef = db.collection(COLECAO_ALUNOS).doc(idFixo);
                        batchAdicao.set(novoDocRef, dadosNovo, { merge: true });
                        countAdicao++;

                        if (countAdicao >= 400) {
                            await batchAdicao.commit();
                            batchAdicao = db.batch();
                            countAdicao = 0;
                        }
                    }

                    if (countAdicao > 0) {
                        await batchAdicao.commit();
                    }
                }

                lancarPopUp("✅ Banco Limpo e Sincronizado!", "sucesso");
                document.getElementById("status").innerText = `✅ Sucesso! Duplicados e ausentes removidos. Alunos sincronizados.`;
                
                if(btn) {
                    btn.disabled = false;
                    btn.style.opacity = "1";
                }
                
                if (document.getElementById("select-turma").value) {
                    aoMudarTurma();
                }

            } catch(e) {
                console.error(e);
                lancarPopUp("Erro na sincronização: " + e.message, "erro");
                if(btn) {
                    btn.disabled = false;
                    btn.style.opacity = "1";
                }
            }
        }

            botao.classList.add('ativo');

        async function registrarOcorrencia(botaoAluno, alunoId, nomeAluno) {
            const turma = document.getElementById("select-turma").value;
            const selectAtiv = document.getElementById("select-atividade");
            const atividade = selectAtiv.value;
            const dataLimite = selectAtiv.options[selectAtiv.selectedIndex].getAttribute("data-prazo");

            if (!turma) {
                lancarPopUp("⚠️ Escolha a Turma!", "erro");
                return;
            }
            if (!ocorrenciaAtiva) {
                lancarPopUp("⚠️ Escolha a Ocorrência primeiro!", "erro");
                return;
            }

            lancarPopUp(`Gravando para ${nomeAluno}...`, "carregando");

            const hoje = obterDataHojeLocal();
            const emAtraso = (ocorrenciaAtiva === "Lição de Sala feita" && dataLimite && hoje > dataLimite);

            try {
                await db.collection(COLECAO_OCORRENCIAS).add({
                    aluno_id: alunoId,
                    aluno_nome: nomeAluno,
                    turma: turma,
                    ocorrencia: ocorrenciaAtiva,
                    atividade: atividade,
                    emAtraso: emAtraso,
                    data: firebase.firestore.FieldValue.serverTimestamp(),
                    data_string: hoje
                });

                await marcarAlunosComLicaoFeita();

                if (ocorrenciaAtiva !== "Lição de Sala feita" && ocorrenciaAtiva !== "Tirou Dúvidas") {
                    botaoAluno.classList.add('piscar');
                    setTimeout(() => botaoAluno.classList.remove('piscar'), 500);
                }

                lancarPopUp(`✅ ${nomeAluno}: ${ocorrenciaAtiva}!`, "sucesso");
                document.getElementById("status").innerText = `✅ Gravado: [${ocorrenciaAtiva}] -> ${nomeAluno}`;

            } catch (error) {
                document.getElementById("status").innerText = `❌ Erro: ${error.message}`;
                lancarPopUp("❌ Falha ao gravar!", "erro");
            }
        }

                        nome: data.nome || "Sem Nome",
                        email: data.email_aluno || "",
                        ordem: data.ordem_matricula !== undefined ? data.ordem_matricula : 999
                    });
                });
                listaAlunos.sort((a, b) => a.ordem - b.ordem);

                if (listaAlunos.length === 0) {
                    lancarPopUp("Nenhum aluno encontrado!", "erro");
                    return;
                }

                let snapAtiv = await db.collection("atividades")
                                       .where("turma", "==", turma)
                                       .get();

                let listaAtividades = [];
                let mapaPrazos = {};

                snapAtiv.forEach(doc => {
                    const d = doc.data();
                    listaAtividades.push({ nome: d.nome, criadoEm: d.criadoEm ? d.criadoEm.toMillis() : 0, dataLimite: d.dataLimite || "" });
                    mapaPrazos[d.nome] = d.dataLimite || "";
                });
                listaAtividades.sort((a, b) => a.criadoEm - b.criadoEm);

                let snapHist = await db.collection(COLECAO_OCORRENCIAS)
                                       .where("turma", "==", turma)
                                       .get();

                let dadosAlunos = {};
                listaAlunos.forEach(a => {
                    const key = a.email || a.nome;
                    dadosAlunos[key] = {
                        nome: a.nome,
                        licoes: {},
                        tirouDuvidas: 0,
                        plataforma: 0,
                        semMaterial: 0,
                        desrespeito: 0
                    };
                });

                snapHist.forEach(doc => {
                    const h = doc.data();
                    const key = h.aluno_id || h.aluno_nome;

                    if (dadosAlunos[key]) {
                        const ativNome = h.atividade || "Geral/Aula";
                        if (h.ocorrencia === "Lição de Sala feita") {
                            dadosAlunos[key].licoes[ativNome] = h.emAtraso ? "Entregue com Atraso" : "Entregue no Prazo";
                        } else if (h.ocorrencia === "Tirou Dúvidas") {
                            dadosAlunos[key].tirouDuvidas += 1;
                        } else if (h.ocorrencia === "Plataforma feita") {
                            dadosAlunos[key].plataforma += 1;
                        } else if (h.ocorrencia === "Não trouxe material") {
                            dadosAlunos[key].semMaterial += 1;
                        } else if (h.ocorrencia === "Desrespeito") {
                            dadosAlunos[key].desrespeito += 1;
                        }
                    }
                });

                const hoje = obterDataHojeLocal();
                let dadosPlanilha = [];

                listaAlunos.forEach(aluno => {
                    const key = aluno.email || aluno.nome;
                    const info = dadosAlunos[key];

                    let linha = { "Aluno": info.nome };

                    listaAtividades.forEach(ativ => {
                        let st = info.licoes[ativ.nome];
                        if (!st) {
                            if (ativ.dataLimite && hoje > ativ.dataLimite) {
                                st = "Atrasado (Não entregue)";
                            } else {
                                st = "Pendente";
                            }
                        }
                        linha[ativ.nome] = st;
                    });

                    linha["Tirou Dúvidas"] = info.tirouDuvidas;
                    linha["Plataformas Feitas"] = info.plataforma;
                    linha["Não Trouxe Material"] = info.semMaterial;
                    linha["Desrespeito"] = info.desrespeito;

                    dadosPlanilha.push(linha);
                });

                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.json_to_sheet(dadosPlanilha);

                const colWidths = [{ wch: 35 }];
                listaAtividades.forEach(() => colWidths.push({ wch: 22 }));
                colWidths.push({ wch: 15 }, { wch: 18 }, { wch: 18 }, { wch: 15 });
                ws['!cols'] = colWidths;

                XLSX.utils.book_append_sheet(wb, ws, `Turma ${turma}`);

                const nomeArquivo = `Relatorio_Desempenho_${turma}_${hoje}`;

                if (formato === 'csv') {
                    XLSX.writeFile(wb, `${nomeArquivo}.csv`, { bookType: 'csv' });
                } else {
                    XLSX.writeFile(wb, `${nomeArquivo}.xlsx`);
                }

                lancarPopUp("✅ Planilha Baixada!", "sucesso");

            } catch (e) {
                console.error("Erro ao gerar planilha:", e);
                lancarPopUp("Erro ao exportar: " + e.message, "erro");
            }
        }
    </script>
</body>
</html>
