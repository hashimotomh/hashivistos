<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor V2 - Modo Rápido (7º Ano)</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #2c3e50; margin-top: 0; margin-bottom: 15px; font-size: 24px; }
        
        .secao-titulo { font-weight: bold; font-size: 14px; color: #7f8c8d; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; border-bottom: 2px solid #ecf0f1; padding-bottom: 5px; margin-top: 15px; }
        
        /* Caixa de Texto do Conteúdo e Controles de Atividades Recentes */
        .input-conteudo { width: 100%; padding: 12px; border: 1px solid #bdc3c7; border-radius: 8px; font-size: 14px; box-sizing: border-box; transition: border 0.2s; }
        .input-conteudo:focus { border-color: #34495e; outline: none; }
        
        .box-atividades-recentes { display: flex; gap: 10px; margin-top: 8px; align-items: center; }
        .select-recentes { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #bdc3c7; font-size: 13px; background-color: #f8fafc; }
        .btn-carregar-recentes { padding: 10px 15px; background-color: #34495e; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; white-space: nowrap; }

        /* Layout das Ocorrências */
        .grid-ocorrencias { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 25px; }
        .btn-acao { padding: 12px 8px; border: 2px solid #bdc3c7; border-radius: 8px; background: #fff; cursor: pointer; font-size: 13px; font-weight: bold; transition: all 0.2s; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        /* Cores das ações quando selecionadas */
        .btn-pos.ativo { background-color: #2ecc71 !important; color: white !important; border-color: #27ae60 !important; transform: scale(1.03); box-shadow: 0 4px 10px rgba(46,204,113,0.3); }
        .btn-neg.ativo { background-color: #e74c3c !important; color: white !important; border-color: #c0392b !important; transform: scale(1.03); box-shadow: 0 4px 10px rgba(231,76,60,0.3); }
        .btn-pos:hover { border-color: #2ecc71; background: #f4fbf7; }
        .btn-neg:hover { border-color: #e74c3c; background: #fdf5f5; }
        .xp-tag { font-size: 11px; opacity: 0.8; margin-top: 3px; }

        /* Layout dos Alunos */
        .grid-alunos { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
        .btn-aluno { padding: 15px 10px; background-color: #ecf0f1; border: 1px solid #bdc3c7; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; text-align: left; transition: all 0.15s; display: flex; align-items: center; justify-content: space-between; text-transform: uppercase; }
        .btn-aluno:hover { background-color: #e2e7e9; transform: translateY(-2px); }
        .btn-aluno:active { transform: translateY(0); }
        
        /* Estilo para Aluno com Atividade Concluída */
        .btn-aluno.concluido { background-color: #2ecc71 !important; color: white !important; border-color: #27ae60 !important; }
        
        /* Estilo especial para o botão de TESTE */
        .btn-aluno-teste { background-color: #e2e8f0; border: 1px dashed #64748b; color: #475569; }
        .btn-aluno-teste:hover { background-color: #cbd5e1; }
        
        /* Animação de clique com sucesso */
        @keyframes piscarSucesso {
            0% { background-color: #2ecc71; color: white; }
            100% { background-color: #ecf0f1; color: #333; }
        }
        .piscar { animation: piscarSucesso 0.6s ease-out; }

        /* Rodapé de Status */
        .barra-status { margin-top: 20px; padding: 12px; background: #34495e; color: white; border-radius: 6px; font-size: 14px; text-align: center; font-weight: bold; min-height: 20px; }

        /* Tabela do Ranking */
        .tabela-ranking { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        .tabela-ranking th, .tabela-ranking td { padding: 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        .tabela-ranking th { background-color: #f8fafc; color: #475569; font-weight: bold; }
        .tabela-ranking tr:nth-child(even) { background-color: #f8fafc; }
        .posicao-top3 { font-weight: bold; color: #d97706; }

        /* Pop-up Toast */
        .popup-notificacao {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background-color: #34495e;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.25);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            max-width: 85%;
            transition: opacity 0.2s ease-in-out;
            opacity: 0;
        }
        .popup-notificacao.mostrar {
            display: flex !important;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .popup-sucesso { background-color: #2ecc71 !important; border: 1px solid #27ae60; }
        .popup-erro { background-color: #e74c3c !important; border: 1px solid #c0392b; }
        .popup-carregando { background-color: #f39c12 !important; border: 1px solid #d35400; }
    </style>
</head>
<body>

<div id="popup-alerta" class="popup-notificacao"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBtY3gnLGcX9biqtgy9Um7C2e1Y21-DSP8",
        authDomain: "gamificacao-hashi.firebaseapp.com",
        projectId: "gamificacao-hashi",
        storageBucket: "gamificacao-hashi.firebasestorage.app",
        messagingSenderId: "1019383886413",
        appId: "1:1019383886413:web:a954f277e096ceef036204",
        measurementId: "G-XJR45JGEGF"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    function lancarPopUp(texto, tipo) {
        const popup = document.getElementById("popup-alerta");
        if (!popup) return;
        
        popup.innerText = texto;
        popup.className = "popup-notificacao";
        
        if(tipo === "sucesso") popup.classList.add("popup-sucesso");
        if(tipo === "erro") popup.classList.add("popup-erro");
        if(tipo === "carregando") popup.classList.add("popup-carregando");
        
        popup.classList.add("mostrar");
        
        if(tipo !== "carregando") {
            setTimeout(() => {
                popup.classList.remove("mostrar");
            }, 2000);
        }
    }

    document.getElementById("senha-prof").addEventListener("keyup", function(event) {
        if (event.key === "Enter") {
            fazerLoginProfessor();
        }
    });

    async function fazerLoginProfessor() {
        const email = document.getElementById("email-prof").value.trim();
        const senha = document.getElementById("senha-prof").value.trim();
        const erroBox = document.getElementById("erro-login-prof");

        if(!email || !senha) {
            erroBox.innerText = "Por favor, preencha o e-mail e a senha.";
            erroBox.style.display = "block";
            return;
        }

        erroBox.style.display = "none";
        document.getElementById("btn-entrar").innerText = "Carregando...";

        try {
            await auth.signInWithEmailAndPassword(email, senha);
            
            document.getElementById("login-professor-box").style.display = "none";
            document.getElementById("painel-professor-conteudo").style.display = "block";
            document.getElementById("status").innerText = "Aguardando seleção de ocorrência...";
            
            lancarPopUp("🔓 Painel Liberado!", "sucesso");
            
            // Inicia funções adicionais
            carregarAtividadesRecentes();
            escutarRankingEmTempoReal();

        } catch (e) {
            document.getElementById("btn-entrar").innerText = "Entrar no Painel";
            erroBox.innerText = "Falha na autenticação: " + e.message;
            erroBox.style.display = "block";
        }
    }

    let acaoAtivaMotivo = "";
    let acaoAtivaXP = 0;

    function selecionarOcorrencia(botao, motivo, xp) {
        document.querySelectorAll('.btn-acao').forEach(b => b.classList.remove('ativo'));
        botao.classList.add('ativo');
        
        acaoAtivaMotivo = motivo;
        acaoAtivaXP = xp;
        
        const statusTxt = `PRONTO: Clique nos alunos para aplicar [ ${motivo} (${xp > 0 ? '+' : ''}${xp} XP) ]`;
        document.getElementById("status").innerText = statusTxt;
        
        lancarPopUp(`Ação: ${motivo}`, "sucesso");
        verificarAlunosConcluidos();
    }

    async function computarPonto(botaoAluno, id, nomeCompleto) {
        if (!acaoAtivaMotivo) {
            document.getElementById("status").innerText = "⚠️ ERRO: Selecione uma ocorrência no topo primeiro!";
            lancarPopUp("⚠️ Escolha uma ocorrência primeiro!", "erro");
            return;
        }

        const conteudoAula = document.getElementById("conteudo-aula").value.trim();
        document.getElementById("status").innerText = `💾 Gravando para ${nomeCompleto}...`;
        
        const primeiroNome = nomeCompleto.split(' ')[0];
        lancarPopUp(`⏳ Salvando ${primeiroNome}...`, "carregando");

        try {
            const alunoRef = db.collection("alunos").doc(id);
            
            await db.runTransaction(async (transaction) => {
                const doc = await transaction.get(alunoRef);
                let novoXp = acaoAtivaXP;
                
                if (doc.exists) {
                    novoXp = (doc.data().xp_atual || 0) + acaoAtivaXP;
                    if(novoXp < 0) novoXp = 0; 
                    transaction.update(alunoRef, { xp_atual: novoXp, nome: nomeCompleto });
                } else {
                    if(novoXp < 0) novoXp = 0;
                    transaction.set(alunoRef, { nome: nomeCompleto, xp_atual: novoXp, pin: "1234" });
                }

                const historicoRef = db.collection("historico").doc();
                transaction.set(historicoRef, {
                    aluno_id: id,
                    motivo: acaoAtivaMotivo,
                    quantidade: acaoAtivaXP,
                    conteudo: conteudoAula || "Conteúdo não especificado",
                    data: firebase.firestore.FieldValue.serverTimestamp()
                });
            });

            botaoAluno.classList.add('piscar');
            setTimeout(() => botaoAluno.classList.remove('piscar'), 600);

            lancarPopUp(`✅ ${primeiroNome}: ${acaoAtivaXP > 0 ? '+' : ''}${acaoAtivaXP} XP!`, "sucesso");
            document.getElementById("status").innerText = `✅ Sucesso! ${acaoAtivaMotivo} computado para ${nomeCompleto}.`;
            
            // Re-verifica se o aluno deve ficar verde fixo
            verificarAlunosConcluidos();

            setTimeout(() => {
                if(acaoAtivaMotivo) {
                    document.getElementById("status").innerText = `PRONTO: Clique nos alunos para aplicar [ ${acaoAtivaMotivo} (${acaoAtivaXP > 0 ? '+' : ''}${acaoAtivaXP} XP) ]`;
                }
            }, 1500);

        } catch (error) {
            document.getElementById("status").innerText = `❌ Erro: ${error.message}`;
            lancarPopUp("❌ Falha de Conexão!", "erro");
        }
    }

    // ========================================================
    // RECURSOS ADICIONADOS: ATIVIDADES RECENTES E VERIFICAÇÃO VERDE
    // ========================================================

    async function carregarAtividadesRecentes() {
        const select = document.getElementById("select-atividades-recentes");
        select.innerHTML = '<option value="">Carregando...</option>';

        try {
            const snapshot = await db.collection("historico")
                .orderBy("data", "desc")
                .limit(100)
                .get();

            const atividadesSet = new Set();
            snapshot.forEach(doc => {
                const c = doc.data().conteudo;
                if(c && c !== "Conteúdo não especificado") {
                    atividadesSet.add(c);
                }
            });

            select.innerHTML = '<option value="">-- Selecione uma atividade anterior --</option>';
            atividadesSet.forEach(atividade => {
                const opt = document.createElement("option");
                opt.value = atividade;
                opt.innerText = atividade;
                select.appendChild(opt);
            });

            lancarPopUp("📋 Atividades Recentes Carregadas", "sucesso");
        } catch (e) {
            select.innerHTML = '<option value="">Erro ao carregar</option>';
            console.error("Erro ao carregar histórico de conteúdos:", e);
        }
    }

    function selecionarAtividadeRecente(selectElem) {
        if(selectElem.value) {
            document.getElementById("conteudo-aula").value = selectElem.value;
            verificarAlunosConcluidos();
        }
    }

    async function verificarAlunosConcluidos() {
        const conteudo = document.getElementById("conteudo-aula").value.trim();
        const botoesAlunos = document.querySelectorAll(".btn-aluno");

        // Limpa estado concluído anterior
        botoesAlunos.forEach(btn => btn.classList.remove("concluido"));

        // Só faz a verificação se houver um conteúdo preenchido e se for ação de Lição
        if(!conteudo || (acaoAtivaMotivo !== "Lição Concluída" && acaoAtivaMotivo !== "Lição do dia")) {
            return;
        }

        try {
            const snapshot = await db.collection("historico")
                .where("conteudo", "==", conteudo)
                .where("motivo", "==", acaoAtivaMotivo)
                .get();

            const alunosConcluidosIds = new Set();
            snapshot.forEach(doc => {
                alunosConcluidosIds.add(doc.data().aluno_id);
            });

            botoesAlunos.forEach(btn => {
                const id = btn.getAttribute("data-id");
                if(alunosConcluidosIds.has(id)) {
                    btn.classList.add("concluido");
                }
            });

        } catch (e) {
            console.error("Erro ao verificar alunos concluídos:", e);
        }
    }

    // ========================================================
    // RECURSO ADICIONADO: RANKING EM TEMPO REAL
    // ========================================================

    function escutarRankingEmTempoReal() {
        db.collection("alunos")
            .orderBy("xp_atual", "desc")
            .onSnapshot(snapshot => {
                const corpoTabela = document.getElementById("corpo-tabela-ranking");
                corpoTabela.innerHTML = "";

                if(snapshot.empty) {
                    corpoTabela.innerHTML = '<tr><td colspan="3" style="text-align:center;">Nenhum aluno registrado ainda.</td></tr>';
                    return;
                }

                let posicao = 1;
                snapshot.forEach(doc => {
                    const dados = doc.data();
                    const tr = document.createElement("tr");

                    let classePos = posicao <= 3 ? "posicao-top3" : "";
                    let medalha = posicao === 1 ? "🥇 " : posicao === 2 ? "🥈 " : posicao === 3 ? "🥉 " : "";

                    tr.innerHTML = `
                        <td class="${classePos}">${medalha}${posicao}º</td>
                        <td>${dados.nome || "Sem Nome"}</td>
                        <td style="text-align: right; font-weight: bold; color: #27ae60;">${dados.xp_atual || 0} XP</td>
                    `;

                    corpoTabela.appendChild(tr);
                    posicao++;
                });
            }, error => {
                console.error("Erro ao escutar ranking:", error);
            });
    }
</script>
